name: Deploy documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Set up Lean and Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          use-mathlib-cache: true

      - name: Verify frozen Lean sources
        run: python3 scripts/source_integrity.py

      - name: Build public appendix entries
        run: lake build AuditExp1Exp2 Textbook

      - name: Generate doc-gen4 documentation
        run: |
          lake build EnumerationTheory:docs
          lake build DG:docs

      - name: Assemble Pages site
        run: |
          mkdir -p site/docs
          cp -a .lake/build/doc/. site/docs/
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=docs/">
            <title>MathCoPilot Lean Appendix</title>
          </head>
          <body>
            <p><a href="docs/">Open the MathCoPilot Lean documentation.</a></p>
          </body>
          </html>
          HTML

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
