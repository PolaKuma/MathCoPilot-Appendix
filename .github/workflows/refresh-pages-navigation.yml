name: Refresh Pages navigation

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Deploy documentation run containing the Pages artifact
        required: true
        default: "30219606070"

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the verified Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: downloaded
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}

      - name: Update navigation only
        run: |
          mkdir site
          tar -xf downloaded/artifact.tar -C site
          python3 scripts/postprocess_doc_nav.py site/docs/navbar.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload refreshed Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: refresh
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
